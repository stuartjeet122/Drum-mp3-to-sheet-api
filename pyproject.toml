[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drum-transcription-api"
version = "0.1.0"
description = "CPU-only drum transcription API foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "filelock>=3.16,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "celery[redis]>=5.4,<6",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "soundfile>=0.13,<1",
    "librosa>=0.11,<1",
    "pretty-midi>=0.2.10,<0.3",
    "music21>=9.3,<10",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "imageio-ffmpeg>=0.6,<0.7", "PyYAML>=6,<7"]
adtof = ["adtof-pytorch @ git+https://github.com/xavriley/ADTOF-pytorch.git@85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9"]
oaf = ["onnxruntime>=1.20,<2"]

[tool.setuptools.packages.find]
include = ["backend*", "engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]